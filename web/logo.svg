<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset=".55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#fb923c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fond (iOS arrondit lui-même les coins de l'icône) -->
  <rect width="512" height="512" fill="#0f1115"/>
  <circle cx="256" cy="270" r="150" fill="url(#glow)"/>

  <!-- anneau d'activité : piste + progression aux trois quarts -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#232733" stroke-width="40"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#ring)" stroke-width="40"
          stroke-linecap="round" stroke-dasharray="838 1118" transform="rotate(-90 256 256)"/>

  <!-- flamme : les calories brûlées -->
  <path fill="url(#flame)" d="M262 118
    C 312 176, 352 214, 348 288
    C 345 346, 304 388, 256 388
    C 204 388, 166 350, 166 300
    C 166 252, 194 222, 214 192
    C 220 230, 232 250, 250 258
    C 240 210, 238 160, 262 118 Z"/>
  <path fill="url(#core)" d="M262 248
    C 292 284, 306 308, 302 336
    C 298 362, 280 376, 258 376
    C 232 376, 214 358, 214 334
    C 214 308, 234 292, 246 272
    C 252 286, 258 290, 264 292
    C 262 278, 258 264, 262 248 Z"/>

  <!-- étincelle : l'effort -->
  <path fill="#fef08a" d="M372 112 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 z"/>
</svg>
